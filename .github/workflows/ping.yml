name: ping

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: curl
        run: |
          curl -sS --max-time 60 -o /dev/null -w "HTTP %{http_code}\n" https://zuche-hitch-board.app.workbuddy.host/health
