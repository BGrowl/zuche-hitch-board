<script>
const PAGE = 60;
let DATA = [], NEW = new Set(), view = [], shown = 0;
// Filtering and sorting use a copy so the data snapshot remains unchanged.
const $ = s => document.querySelector(s);

// 车源类别：新能源 / 高端车 / 普通车（服务端按 car_class.py 规则算好放在 cls 字段）
const CLSCLS = {'新能源':'nv','高端车':'lx','普通车':'pc'};
// 档次配色：分数 → 1 尊享(金) / 2 高级(银) / 3 中档(铜) / 4 普通(素)
const TIER_NAME = {1:'尊享',2:'高级',3:'中档',4:'入门'};
function tier(r){ r=Number(r)||0; return r>=90?1:(r>=80?2:(r>=70?3:4)); }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function fmtAgo(ms){
  if(!ms) return '尚未抓取';
  const s = Math.max(0,(Date.now()-ms)/1000);
  let ago = s<60 ? Math.round(s)+' 秒前'
          : s<3600 ? Math.round(s/60)+' 分钟前'
          : s<86400 ? Math.round(s/3600)+' 小时前'
          : Math.round(s/86400)+' 天前';
  const d = new Date(ms);
  const p = n => String(n).padStart(2,'0');
  return ago + '（' + (d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + '）';
}


function selectRows(rows, f={}, newIds=new Set(), order='rank-desc'){
  const q=String(f.query||'').trim().toLowerCase();
  const result=rows.filter(d=>
    (!f.from||d.from===f.from)&&(!f.to||d.to===f.to)&&(!f.cls||d.cls===f.cls)&&
    (!f.only1||Number(d.price)===1)&&(!f.onlynew||newIds.has(String(d.id)))&&
    (!q||[d.model,d.from,d.to,d.cls,d.body].join(' ').toLowerCase().includes(q)));
  const [key,direction]=order.split('-');
  const sign=direction==='asc'?1:-1;
  return result.sort((a,b)=>sign*((Number(a[key])||0)-(Number(b[key])||0)));
}
function apply(){
  const only1=$('#only1').classList.contains('on'), onlynew=$('#onlynew').classList.contains('on');
  view=selectRows(DATA,{from:ssFrom.value,to:ssTo.value,cls:$('#cls').value,
    query:$('#q').value,only1,onlynew},NEW,$('#sort').value);
  shown=0;
  render(true);
  $('#resultCount').textContent=view.length.toLocaleString()+' 台车源';
  $('#empty').hidden=!!view.length;
  $('#emptyTitle').textContent='暂时没有符合条件的车源';
  $('#only1').setAttribute('aria-pressed',String(only1));
  $('#onlynew').setAttribute('aria-pressed',String(onlynew));
  document.querySelectorAll('[data-nav]').forEach(btn=>{
    const active=btn.dataset.nav==='one'?only1:btn.dataset.nav==='new'?onlynew:!only1&&!onlynew;
    btn.classList.toggle('active',active);
    btn.setAttribute('aria-pressed',String(active));
  });
}
const CROWN = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 6 4 4 5-6 5 6 4-4-2 12H5Z"/></svg>', CALENDAR = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18m-13 5h3"/></svg>';

function render(reset){
  const g=$('#grid'),frag=document.createDocumentFragment();
  const part=view.slice(shown,shown+PAGE);
  for(const d of part){
    const el=document.createElement('article'),t=tier(d.rank);
    el.className='card t'+t;
    const specs=[d.body,d.seats,d.energy].filter(Boolean).map(s=>'<span>'+esc(s)+'</span>').join('');
    const km=Number(d.km||0),drive=Number(d.drive||0),kmHtml=drive>0?'<span class="route-km" title="驾车里程（OSRM / OpenStreetMap 路网）'+(km>0?'，直线 '+km.toLocaleString('en-US')+' km':'')+'">驾车 '+drive.toLocaleString('en-US')+' km</span>':(km>0?'<span class="route-km" title="直线距离（非驾车里程）；驾车里程尚未算出">直线 '+km.toLocaleString('en-US')+' km</span>':(km===0&&d.from===d.to?'<span class="route-km">同城</span>':''));
    el.innerHTML='<div class="card-head"><div class="model-group"><h3 class="model">'+esc(d.model)+'</h3><span class="tier lv'+t+'">'+TIER_NAME[t]+'</span></div>'+
      '<div class="price" aria-label="租金 '+esc(d.price)+' 元"><span class="currency">¥</span>'+esc(d.price)+
      (d.est&&Number(d.est)>Number(d.price)?'<small>¥'+esc(d.est)+'</small>':'')+'</div></div>'+
      '<div class="route" aria-label="从 '+esc(d.from)+' 取车，到 '+esc(d.to)+' 还车'+(drive>0?'，驾车里程约 '+drive+' 公里':(km>0?'，直线距离约 '+km+' 公里':''))+'"><span class="route-cities"><span class="place-label">取</span><span class="city">'+esc(d.from)+'</span><span class="route-arrow" aria-hidden="true">→</span><span class="place-label">还</span><span class="city">'+esc(d.to)+'</span></span>'+kmHtml+'</div>'+
      '<div class="trip-detail"><span>'+esc(d.bd)+' 至 '+esc(d.ed)+'</span><span class="days">'+esc(d.days)+' 天</span></div>'+
      '<div class="specs"><span class="category">'+esc(d.cls||'')+'</span>'+specs+
      (NEW.has(String(d.id))?'<span class="new-badge">本轮新增</span>':'')+'</div>';
    el.setAttribute('title','车源编号 '+String(d.id));
    frag.appendChild(el);
  }
  if(reset)g.innerHTML='';
  g.appendChild(frag);shown+=part.length;
  $('#more').hidden=shown>=view.length;
  $('#more').textContent='再看 '+Math.min(PAGE,view.length-shown)+' 台车源';
}
function fillSelect(sel, cur, allLabel, values){
  sel.innerHTML='<option value="">'+allLabel+'</option>';
  for(const c of values){const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);}
  if(values.includes(cur)) sel.value=cur;
}
function uniq(arr){return [...new Set(arr.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh'));}

// 可搜索下拉：城市有几十个，原生 select 找起来费劲 → 打开就能搜
function makeSearchSelect(root, allLabel, onChange){
  let val='', open=false, opts=[allLabel];
  const btn=document.createElement('button');
  btn.type='button'; btn.className='ss-btn'; btn.setAttribute('aria-label',allLabel); btn.setAttribute('aria-expanded','false');
  const txt=document.createElement('span'); txt.className='ss-txt'; txt.textContent='不限城市';
  const car=document.createElement('i'); car.className='ss-car'; car.textContent='▼';
  const prefix=document.createElement('span'); prefix.className='ss-prefix'; prefix.textContent=allLabel.includes('取车')?'取车':'还车'; btn.appendChild(prefix); btn.appendChild(txt); btn.appendChild(car);
  const pop=document.createElement('div'); pop.className='ss-pop'; pop.hidden=true;
  const q=document.createElement('input'); q.className='ss-q'; q.type='search';
  q.setAttribute('aria-label',allLabel+'搜索'); q.placeholder='输入城市名筛选…'; q.autocomplete='off';
  const list=document.createElement('div'); list.className='ss-list';
  pop.appendChild(q); pop.appendChild(list);
  root.appendChild(btn); root.appendChild(pop);

  function draw(kw){
    const k=(kw||'').trim().toLowerCase();
    const arr=opts.filter(c=>!k||c.toLowerCase().includes(k));
    list.innerHTML='';
    if(!arr.length){ list.innerHTML='<div class="ss-none">没有匹配的城市</div>'; return; }
    for(const c of arr){
      const it=document.createElement('button');
      it.type='button';
      it.className='ss-item'+((c===allLabel?'':c)===val?' on':'');
      it.textContent=c;
      it.onclick=()=>{ set(c===allLabel?'':c); close(); btn.focus(); };
      list.appendChild(it);
    }
  }
  function set(v, fire){
    val=v||''; txt.textContent=val||'不限城市'; btn.setAttribute('aria-label',(allLabel.includes('取车')?'取车城市':'还车城市')+'：'+(val||'不限城市'));
    if(fire!==false) onChange(val);
  }
  function openPop(){
    open=true; pop.hidden=false; btn.setAttribute('aria-expanded','true');
    const r=root.getBoundingClientRect();
    if(r.left+260>window.innerWidth){ pop.style.left='auto'; pop.style.right='0'; }
    else { pop.style.left='0'; pop.style.right='auto'; }
    q.value=''; draw(''); q.focus();
  }
  function close(){ open=false; pop.hidden=true; btn.setAttribute('aria-expanded','false'); }

  btn.onclick=e=>{ e.stopPropagation(); if(open) close(); else openPop(); };
  pop.onkeydown=e=>{ if(e.key==='Escape'){ e.stopPropagation(); close(); btn.focus(); } }; q.oninput=()=>draw(q.value);
  q.onkeydown=e=>{
    if(e.key==='Enter'){ e.preventDefault(); const f=list.querySelector('.ss-item'); if(f) f.click(); btn.focus(); }
    else if(e.key==='Escape'){ close(); btn.focus(); }
  };
  document.addEventListener('click', e=>{ if(open && !root.contains(e.target)) close(); });

  return {
    get value(){ return val; },
    set(v){ set(v, false); },
    setOptions(vals){
      opts=[allLabel].concat(vals||[]);
      if(val && !(vals||[]).includes(val)) set('', false);
      draw(q.value);
    },
  };
}

const ssFrom = makeSearchSelect($('#ssFrom'), '全部取车城市', ()=>apply());
const ssTo   = makeSearchSelect($('#ssTo'),   '全部还车城市', ()=>apply());

function buildSelects(){
  ssFrom.setOptions(uniq(DATA.map(d=>d.from)));
  ssTo.setOptions(uniq(DATA.map(d=>d.to)));
  // 类别（新能源 / 高端车 / 普通车）按出现次数从多到少排
  const cnt={};
  DATA.forEach(d=>{ if(d.cls) cnt[d.cls]=(cnt[d.cls]||0)+1; });
  const clss=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  fillSelect($('#cls'), $('#cls').value, '全部类别', clss);
}


function updateSummary(j){
  const fresh=DATA.filter(d=>NEW.has(String(d.id))).length;
  $('#total').textContent=DATA.length.toLocaleString();
  $('#newCount').textContent=fresh.toLocaleString();
  $('#oneCount').textContent=DATA.filter(d=>Number(d.price)===1).length.toLocaleString();
  $('#goodCount').textContent=DATA.filter(d=>tier(d.rank)<=3).length.toLocaleString();
  const stale=!j.updatedAt||Date.now()-j.updatedAt>3600e3;
  $('#dot').className='dot'+(j.error?' err':stale?' stale':'');
  $('#liveText').textContent=j.error?'数据更新异常':stale?'当前为历史快照':'数据自动更新中';
  $('#updated').textContent=(j.error?'更新异常，保留上次数据，':'更新于 ')+fmtAgo(j.updatedAt)+
    (j.total!=null&&Number(j.total)!==DATA.length?'，接口总量 '+j.total+' 台，当前载入 '+DATA.length+' 台':'');
  $('#dataStatus').classList.toggle('warning',!!j.error||stale);
  $('#dataStatus').title=j.error?String(j.error):'后台每 10 分钟抓取，页面每 2 分钟读取数据';
}
async function load(first){
  try{
    let j;
    const embedded=document.getElementById('snapshot-data');
    if(embedded) j=JSON.parse(embedded.textContent);
    else {
      const r=await fetch('./data.json?t='+Date.now(),{cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      j=await r.json();
    }
    if(!Array.isArray(j.items))throw new Error('数据格式不正确');
    DATA=j.items;NEW=new Set((j.newIds||[]).map(String));
    updateSummary(j);buildSelects();apply();
  }catch(e){
    $('#updated').textContent='暂时无法读取数据，将在下次刷新重试'+(DATA.length?'，已保留当前车源':'');
    $('#dot').className='dot err';$('#liveText').textContent='数据读取失败';
    $('#dataStatus').classList.add('warning');
    if(!DATA.length){$('#empty').hidden=false;$('#emptyTitle').textContent='车源数据暂未就绪';}
  }
}
function resetFilters(){
  ssFrom.set('');ssTo.set('');$('#cls').value='';$('#q').value='';
  $('#only1').classList.remove('on');$('#onlynew').classList.remove('on');
  $('#sort').value='rank-desc';apply();
}
$('#cls').onchange=()=>apply();
$('#q').oninput=()=>apply();
$('#sort').onchange=()=>apply();
$('#only1').onclick=e=>{e.currentTarget.classList.toggle('on');apply();};
$('#onlynew').onclick=e=>{e.currentTarget.classList.toggle('on');apply();};
$('#reset').onclick=resetFilters;
$('#emptyReset').onclick=resetFilters;
$('#more').onclick=()=>render(false);
document.querySelectorAll('[data-nav]').forEach(btn=>btn.onclick=()=>{
  if(btn.dataset.nav==='all'){
    $('#only1').classList.remove('on');$('#onlynew').classList.remove('on');
  }else btn.classList.toggle('on');
  apply();
});
load(true);
if(!document.getElementById('snapshot-data'))setInterval(()=>load(false),120000);
</script></body></html>
