name: keepalive

# 作用：把云沙箱「按住不放」，让推送真正按 10 分钟走。
#
# 背景一：托管沙箱没人访问就休眠，进程一休眠，server.py 里 600s 的抓取循环
#         和「每小时汇总推送」都停。所以要有一个外部角色定期请求它。
#
# 背景二（2026-10-27 实测）：GitHub 的 schedule 是 best-effort，`*/10` 被节流得
#         很厉害 —— 挂了 8 小时只跑了 2 次（22:49Z、01:39Z，间隔 2h49m）。
#         所以不能靠 cron 提供 10 分钟节奏，改成：
#         cron 每 6 小时兜底启动一次 → 一个 job 内部循环 ping 35 轮（≈5h50m），
#         相邻两轮之间 sleep 600。节奏由 job 内部的 sleep 保证，不依赖 cron 精度。
#
# 代价：公开仓库不计 Actions 分钟数；job 上限 6 小时，这里设 358 分钟。
#
# 坑：不要在 run: | 里写正文顶格的 heredoc —— 会提前终止块标量，整个文件解析失败
#     （表现为 workflow 列表里有、但 dispatch 报 "does not have workflow_dispatch trigger"）。

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Ping /health every 10 minutes (~5h50m)
        env:
          URL: https://zuche-hitch-board.app.workbuddy.host/health
          ROUNDS: "35"
          GAP: "600"
        run: |
          set -u
          echo "start $(date -u '+%Y-%m-%d %H:%M:%SZ') rounds=$ROUNDS gap=${GAP}s"
          for i in $(seq 1 "$ROUNDS"); do
            code=$(curl -sS -o resp.json -w '%{http_code}' --max-time 60 "$URL" || echo 000)
            echo "[$(date -u '+%m-%d %H:%M:%SZ')] round $i/$ROUNDS -> HTTP $code"
            if [ "$code" = "200" ]; then
              jq -r '"  runs=\(.runs) count=\(.count) new=\(.newCount) push=\(.push.info)"' resp.json || true
            fi
            if [ "$i" -lt "$ROUNDS" ]; then sleep "$GAP"; fi
          done
          echo "done $(date -u '+%Y-%m-%d %H:%M:%SZ')"
